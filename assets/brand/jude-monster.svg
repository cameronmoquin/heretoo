<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Jude-a-phone mascot. One horn, one tattered ear, a wide vampire eye and a
    heavy-lidded zombie one, two fangs, stitches across the brow.

    Drawn as line art in solid black on transparent on purpose: the app applies
    tintColor at render time, so the same PNG works as near-black ink on the
    light palette and near-white on the dark one. A filled, multi-tone mascot
    would need two assets and would still fight the monochrome system.

    Asymmetry is doing the characterful work — the horn is off-centre, the eyes
    differ in size and height, the grin is crooked. A symmetrical version of
    this reads as a generic blob at tile size.
  -->
  <g fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 40 C66 26 60 15 55 5 C64 11 76 23 85 36" fill="#000000" stroke-width="5"/>
    <path d="M160 78 L186 58 L179 92 L168 88"/>
    <path d="M100 30 C139 30 163 58 163 97 C163 138 138 174 100 174 C62 174 37 138 37 97 C37 58 61 30 100 30 Z"/>
    <circle cx="76" cy="94" r="17"/>
    <circle cx="79" cy="97" r="8" fill="#000000" stroke="none"/>
    <path d="M110 100 C116 90 132 90 138 100"/>
    <path d="M124 100 L124 107" stroke-width="5"/>
    <path d="M70 132 Q101 154 133 129"/>
    <path d="M86 138 L90 151 L95 137" fill="#000000" stroke-width="4"/>
    <path d="M112 141 L116 153 L121 138" fill="#000000" stroke-width="4"/>
    <path d="M104 52 L130 46" stroke-width="5"/>
    <path d="M109 45 L111 58 M118 43 L120 56 M127 41 L129 54" stroke-width="4"/>
  </g>
</svg>
