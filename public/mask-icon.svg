<?xml version="1.0" encoding="UTF-8"?>
<!--
  Safari pinned-tab mask icon — single-color silhouette of the HereToo
  tree mark. Same geometry as public/favicon.svg and the in-app
  HereTooLogo (components/shared/Logo.tsx) but flat black on transparent
  so Safari can tint it with the user's accent color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <g fill="black">
    <circle cx="50" cy="6" r="7"/>
    <rect x="44" y="6" width="12" height="62" rx="6"/>
    <rect x="12" y="56" width="76" height="12" rx="2"/>
    <rect x="14" y="30" width="14" height="84" rx="7"/>
    <rect x="8" y="110" width="26" height="6" rx="3"/>
    <rect x="72" y="30" width="14" height="84" rx="7"/>
    <rect x="66" y="110" width="26" height="6" rx="3"/>
  </g>
</svg>
