<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background matches the HereToo welcome screen (#0A0A0F) -->
  <rect width="64" height="64" rx="12" fill="#0A0A0F"/>
  <!-- HT wordmark, glitch chromatic offset: red ↖, green ↘, white center -->
  <g font-family="Inter, system-ui, -apple-system, 'Helvetica Neue', sans-serif"
     font-weight="900" font-size="36" letter-spacing="2"
     text-anchor="middle" dominant-baseline="central">
    <text x="30" y="33" fill="#FF0040" opacity="0.7">HT</text>
    <text x="34" y="35" fill="#00FF88" opacity="0.7">HT</text>
    <text x="32" y="34" fill="#FFFFFF">HT</text>
  </g>
</svg>
