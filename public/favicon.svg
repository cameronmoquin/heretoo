<?xml version="1.0" encoding="UTF-8"?>
<!--
  HereToo logo — "HT" stylized as a family tree. Two trunks join at the
  crossbar; one stem rises above to a bud. Mirrors the in-app
  HereTooLogo component (components/shared/Logo.tsx) so the brand
  reads consistently from web tab → PWA install → Apple home screen
  → social share preview → in-app header.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Dark brand background — rounded square so the logo reads as
       an app tile when used as a favicon / app icon. -->
  <rect width="100" height="120" rx="20" fill="#0A0A0F"/>
  <!-- Mark color: ivory — matches the brand-ivory accent
       (Colors.brandIvory = #F0EEE8). -->
  <g fill="#F0EEE8">
    <!-- Apex bud (canopy / new growth) -->
    <circle cx="50" cy="6" r="7"/>
    <!-- Central stem (T's vertical, tree's growth shoot) -->
    <rect x="44" y="6" width="12" height="62" rx="6"/>
    <!-- Crossbar (H crossbar AND T top) -->
    <rect x="12" y="56" width="76" height="12" rx="2"/>
    <!-- Left trunk -->
    <rect x="14" y="30" width="14" height="84" rx="7"/>
    <!-- Left root flare -->
    <rect x="8" y="110" width="26" height="6" rx="3"/>
    <!-- Right trunk -->
    <rect x="72" y="30" width="14" height="84" rx="7"/>
    <!-- Right root flare -->
    <rect x="66" y="110" width="26" height="6" rx="3"/>
  </g>
</svg>
