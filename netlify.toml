# Netlify build configuration
# See DEPLOYMENT.md for full deploy flow.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# index.html: NEVER cache — must always fetch the latest.
# Stale index.html references dead JS bundle hashes and breaks the app.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# _build.txt: never cache — used to verify deployed version.
[[headers]]
  for = "/_build.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted JS/CSS bundles: cache aggressively (1 year).
# Expo adds a content hash to every filename, so a new build = new filename.
[[headers]]
  for = "/_expo/static/js/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_expo/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Assets (fonts, images): cache 1 day
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Retired URLs ─────────────────────────────────────────────────────
# These MUST sit above the SPA fallback. Netlify takes the first rule
# that matches, and "/*" matches everything.
#
# Each retired path also keeps an in-app <Redirect> stub under app/, and
# both layers are needed. Netlify catches the cold hit — a bookmark, a
# pasted link, an unfurl, a crawler — and corrects the address bar before
# the bundle loads. The stub catches the warm one, because client-side
# routing resolves in the browser and never reaches this file.
#
# STATUS 302, DELIBERATELY. A 301 is cached by browsers indefinitely and
# ignores Cache-Control, so a wrong one strands every visitor who hit it
# until they clear state by hand. These go out as temporary, get verified
# against real links, and are promoted to 301 in a later change once
# they have proven themselves. Promotion is the last step, not the first.
#
# chat → messages. The room is called Messages; the URL now says so.
[[redirects]]
  from = "/chat"
  to = "/messages"
  status = 302

[[redirects]]
  from = "/chat/*"
  to = "/messages/:splat"
  status = 302

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
